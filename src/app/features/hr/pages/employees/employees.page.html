<div class="page-header"><div><span class="eyebrow">Human resources</span><h1>Employees</h1><p>Employee directory and organizational assignments.</p></div><button class="btn btn--primary" (click)="create()"><svg lucideCirclePlus></svg>Add employee</button></div><div class="employee-grid">@for(x of rows();track x.id){<article class="panel employee-card"><div class="employee-card__head"><span><svg lucideUserRound></svg></span><div><strong>{{ x.fullName }}</strong><small>{{ x.employeeNumber }}</small></div></div><div class="employee-email"><svg lucideMail></svg>{{ x.email || 'No email' }}</div><div class="employee-scope"><span>Department</span><strong>{{ x.departmentId || 'Unassigned' }}</strong><span>Position</span><strong>{{ x.positionId || 'Unassigned' }}</strong></div><div class="employee-actions"><button class="btn btn--secondary" (click)="edit(x)"><svg lucidePencil></svg>Edit</button><button class="icon-danger" (click)="remove(x)"><svg lucideTrash2></svg></button></div></article>}@empty{<div class="panel empty-employees">No employees found.</div>}</div><app-modal [open]="modal()" [title]="editId()?'Edit Employee':'Add Employee'" (closed)="modal.set(false)"><form class="employee-form" (ngSubmit)="save()"><label><span>Employee number</span><input name="employeeNumber" [(ngModel)]="employeeNumber" required></label><label><span>Full name</span><input name="fullName" [(ngModel)]="fullName" required></label><label><span>Email</span><input name="email" type="email" [(ngModel)]="email"></label><label><span>Department ID</span><input name="departmentId" [(ngModel)]="departmentId"></label><label><span>Position ID</span><input name="positionId" [(ngModel)]="positionId"></label><label><span>Branch ID</span><input name="branchId" [(ngModel)]="branchId"></label><div class="form-actions"><button class="btn btn--secondary" type="button" (click)="modal.set(false)">Cancel</button><button class="btn btn--primary" type="submit">Save employee</button></div></form></app-modal>
