<div class="form-page">

  @if (loading()) {

    <app-spin
      size="large"
      [label]="'purchaseRequests.loadingOne' | translate" />

  } @else if (errorMessage()) {

    <section class="state">
      <strong>
        {{ 'purchaseRequests.loadOneFailed' | translate }}
      </strong>

      <span>
        {{ errorMessage() }}
      </span>

      <button
        type="button"
        (click)="load()">
        {{ 'common.tryAgain' | translate }}
      </button>
    </section>

  } @else if (item(); as request) {

    <header>
      <span>
        {{ 'purchaseRequests.section' | translate }}
      </span>

      <h1>
        {{ 'purchaseRequests.edit' | translate }}
      </h1>

      <p>
        {{ request.referenceNumber }}
      </p>
    </header>

    <app-purchase-request-form
      submitLabel="purchaseRequests.saveChanges"
      [showReferenceNumber]="false"
      [initialBranchId]="request.branchId"
      [initialReferenceNumber]="request.referenceNumber"
      [initialTitle]="request.title"
      [initialNotes]="request.notes"
      [initialAmount]="request.amount"
      [initialEventAtUtc]="request.eventAtUtc"
      [initialRelatedEntityId]="request.relatedEntityId"
      [initialRelatedEntityType]="request.relatedEntityType"
      [submitting]="submitting()"
      (submitted)="submit($event)"
      (cancelled)="cancel()" />

  }

</div>
