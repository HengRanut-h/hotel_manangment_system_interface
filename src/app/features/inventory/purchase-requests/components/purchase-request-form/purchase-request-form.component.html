<form
  class="request-form"
  (submit)="$event.preventDefault(); submit()">

  <section class="form-card">

    <div class="form-card__heading">
      <span class="form-card__icon">
        <svg lucideClipboardList></svg>
      </span>

      <div>
        <h2>
          {{ 'purchaseRequests.requestInformation' | translate }}
        </h2>

        <p>
          {{ 'purchaseRequests.requestInformationDescription' | translate }}
        </p>
      </div>
    </div>

    <div class="form-grid">

      @if (showReferenceNumber()) {
        <label class="field">
          <span>
            {{ 'purchaseRequests.referenceNumber' | translate }}
          </span>

          <input
            type="text"
            maxlength="100"
            autocomplete="off"
            [value]="referenceNumber()"
            [placeholder]="'purchaseRequests.referencePlaceholder' | translate"
            (input)="setReferenceNumber($event)" />

          @if (isReferenceNumberInvalid()) {
            <small class="field-error">
              {{ 'purchaseRequests.referenceRequired' | translate }}
            </small>
          }
        </label>
      }

      <label class="field">
        <span>
          {{ 'purchaseRequests.titleLabel' | translate }}
        </span>

        <input
          type="text"
          maxlength="200"
          autocomplete="off"
          [value]="title()"
          [placeholder]="'purchaseRequests.titlePlaceholder' | translate"
          (input)="setTitle($event)" />

        @if (isTitleInvalid()) {
          <small class="field-error">
            {{ 'purchaseRequests.titleRequired' | translate }}
          </small>
        }
      </label>

      <label class="field">
        <span>
          {{ 'purchaseRequests.inventoryItem' | translate }}
        </span>

        <select
          [value]="relatedEntityId()"
          [disabled]="inventoryLoading()"
          (change)="setInventoryItem($event)">
          <option value="">
            {{
              (
                inventoryLoading()
                  ? 'purchaseRequests.loadingInventoryItems'
                  : 'purchaseRequests.selectInventoryItem'
              )
                | translate
            }}
          </option>

          @for (
            item of inventoryItems();
            track item.id
          ) {
            <option [value]="item.id">
              {{ item.sku }} — {{ item.name }}
              @if (item.unit) {
                ({{ item.unit }})
              }
            </option>
          }
        </select>
      </label>

      <label class="field">
        <span>
          {{ 'purchaseRequests.eventAt' | translate }}
        </span>

        <input
          type="datetime-local"
          [value]="eventAtUtc()"
          (input)="setEventAtUtc($event)" />
      </label>

      <label class="field">
        <span>
          {{ 'purchaseRequests.amount' | translate }}
        </span>

        <input
          type="number"
          step="0.01"
          [value]="amount()"
          [placeholder]="'purchaseRequests.amountPlaceholder' | translate"
          (input)="setAmount($event)" />

        <small class="field-hint">
          {{ 'purchaseRequests.amountHelp' | translate }}
        </small>
      </label>

      <label class="field field--full">
        <span>
          {{ 'purchaseRequests.notes' | translate }}
        </span>

        <textarea
          rows="5"
          maxlength="2000"
          [value]="notes()"
          [placeholder]="'purchaseRequests.notesPlaceholder' | translate"
          (input)="setNotes($event)"></textarea>
      </label>

    </div>

  </section>

  <footer class="form-actions">

    <button
      type="button"
      class="button button--secondary"
      [disabled]="submitting()"
      (click)="cancel()">
      <svg lucideArrowLeft></svg>

      <span>
        {{ 'common.cancel' | translate }}
      </span>
    </button>

    <button
      type="submit"
      class="button button--primary"
      [disabled]="submitting()">
      <svg lucideCheck></svg>

      <span>
        {{
          (
            submitting()
              ? 'common.saving'
              : submitLabel()
          )
            | translate
        }}
      </span>
    </button>

  </footer>

</form>
