<form
  class="request-form"
  (submit)="$event.preventDefault(); submit()">

  <section class="form-card">

    <div class="form-card__heading">
      <span class="form-card__icon">
        <svg lucideClipboardList></svg>
      </span>

      <div>
        <h2>
          {{ 'purchaseOrders.requestInformation' | translate }}
        </h2>

        <p>
          {{ 'purchaseOrders.requestInformationDescription' | translate }}
        </p>
      </div>
    </div>

    <div class="form-grid">

      @if (showReferenceNumber()) {
        <label class="field">
          <span>
            {{ 'purchaseOrders.referenceNumber' | translate }}
          </span>

          <input
            type="text"
            maxlength="100"
            autocomplete="off"
            [value]="referenceNumber()"
            [placeholder]="'purchaseOrders.referencePlaceholder' | translate"
            (input)="setReferenceNumber($event)" />

          @if (isReferenceNumberInvalid()) {
            <small class="field-error">
              {{ 'purchaseOrders.referenceRequired' | translate }}
            </small>
          }
        </label>
      }

      <label class="field">
        <span>
          {{ 'purchaseOrders.titleLabel' | translate }}
        </span>

        <input
          type="text"
          maxlength="200"
          autocomplete="off"
          [value]="title()"
          [placeholder]="'purchaseOrders.titlePlaceholder' | translate"
          (input)="setTitle($event)" />

        @if (isTitleInvalid()) {
          <small class="field-error">
            {{ 'purchaseOrders.titleRequired' | translate }}
          </small>
        }
      </label>

      <label class="field">
        <span>
          {{ 'purchaseOrders.supplier' | translate }}
        </span>

        <select
          [value]="relatedEntityId()"
          [disabled]="suppliersLoading()"
          (change)="setSupplier($event)">
          <option value="">
            {{
              (
                suppliersLoading()
                  ? 'purchaseOrders.loadingSuppliers'
                  : 'purchaseOrders.selectSupplier'
              )
                | translate
            }}
          </option>

          @for (
            supplier of suppliers();
            track supplier.id
          ) {
            <option [value]="supplier.id">
              {{ supplier.code }} — {{ supplier.name }}
            </option>
          }
        </select>
      </label>

      <label class="field">
        <span>
          {{ 'purchaseOrders.eventAt' | translate }}
        </span>

        <input
          type="datetime-local"
          [value]="eventAtUtc()"
          (input)="setEventAtUtc($event)" />
      </label>

      <label class="field">
        <span>
          {{ 'purchaseOrders.amount' | translate }}
        </span>

        <input
          type="number"
          step="0.01"
          [value]="amount()"
          [placeholder]="'purchaseOrders.amountPlaceholder' | translate"
          (input)="setAmount($event)" />

        <small class="field-hint">
          {{ 'purchaseOrders.amountHelp' | translate }}
        </small>
      </label>

      <label class="field field--full">
        <span>
          {{ 'purchaseOrders.notes' | translate }}
        </span>

        <textarea
          rows="5"
          maxlength="2000"
          [value]="notes()"
          [placeholder]="'purchaseOrders.notesPlaceholder' | translate"
          (input)="setNotes($event)"></textarea>
      </label>

    </div>

  </section>

  <footer class="form-actions">

    <button
      type="button"
      class="button button--secondary"
      [disabled]="submitting()"
      (click)="cancel()">
      <svg lucideArrowLeft></svg>

      <span>
        {{ 'common.cancel' | translate }}
      </span>
    </button>

    <button
      type="submit"
      class="button button--primary"
      [disabled]="submitting()">
      <svg lucideCheck></svg>

      <span>
        {{
          (
            submitting()
              ? 'common.saving'
              : submitLabel()
          )
            | translate
        }}
      </span>
    </button>

  </footer>

</form>
