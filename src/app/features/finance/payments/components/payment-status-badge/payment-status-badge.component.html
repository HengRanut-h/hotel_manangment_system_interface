<span
  class="badge"
  [class]="className()"
>
  @switch (
    status()
  ) {

    @case (
      'Completed'
    ) {
      <svg lucideCircleCheck
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @case (
      'Pending'
    ) {
      <svg lucideClock3
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @case (
      'Failed'
    ) {
      <svg lucideCircleX
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @case (
      'Cancelled'
    ) {
      <svg lucideBan
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @case (
      'Refunded'
    ) {
      <svg lucideRotateCcw
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @default {
      <svg lucideCircleHelp
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

  }

  {{ translationKey() | translate }}
</span>
