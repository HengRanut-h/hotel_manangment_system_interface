<form
  class="form-card"
  (ngSubmit)="submit()"
>

  <div class="form-header">

    <div class="form-icon">
      <svg lucideGauge
        [size]="22"
        [strokeWidth]="2"
      ></svg>
    </div>

    <div>
      <h2>
        Create Meter Reading
      </h2>

      <p>
        Record the latest value for a utility meter.
      </p>
    </div>

  </div>


  @if (
    touched() &&
    (
      !meterId().trim() ||
      currentReading() === null ||
      currentReading()! < 0 ||
      !readingDate()
    )
  ) {
    <div class="validation">
      Meter ID, reading value and date are required.
    </div>
  }


  <div class="form-grid">

    <label class="field">

      <span>
        Meter ID *
      </span>

      <input
        type="text"
        name="meterId"
        [ngModel]="meterId()"
        (ngModelChange)="meterId.set($event)"
      />

    </label>


    <label class="field">

      <span>
        Current Reading *
      </span>

      <input
        type="number"
        min="0"
        step="0.01"
        name="currentReading"
        [ngModel]="currentReading()"
        (ngModelChange)="currentReading.set($event)"
      />

    </label>


    <label class="field">

      <span>
        Reading Date *
      </span>

      <input
        type="datetime-local"
        name="readingDate"
        [ngModel]="readingDate()"
        (ngModelChange)="readingDate.set($event)"
      />

    </label>


    <label class="field full">

      <span>
        Notes
      </span>

      <textarea
        rows="4"
        name="notes"
        [ngModel]="notes()"
        (ngModelChange)="notes.set($event)"
      ></textarea>

    </label>

  </div>


  <div class="actions">

    <button
      type="button"
      class="secondary"
      [disabled]="submitting()"
      (click)="cancelled.emit()"
    >
      <svg lucideX
        [size]="17"
        [strokeWidth]="2"
      ></svg>

      Cancel
    </button>


    <button
      type="submit"
      class="primary"
      [disabled]="submitting()"
    >
      <svg lucideSave
        [size]="17"
        [strokeWidth]="2"
      ></svg>

      {{
        submitting()
          ? 'Saving...'
          : 'Save Reading'
      }}
    </button>

  </div>

</form>
