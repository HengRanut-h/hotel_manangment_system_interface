<section class="page">

  <a
    class="back-link"
    routerLink="/app/finance/meter-readings"
  >
    <svg lucideArrowLeft
      [size]="17"
      [strokeWidth]="2"
    ></svg>

    Back to Meter Readings
  </a>


  <div class="page-header">

    <div class="heading">

      <div class="heading-icon">
        <svg lucideGauge
          [size]="24"
          [strokeWidth]="2"
        ></svg>
      </div>

      <div>
        <h1>
          Create Meter Reading
        </h1>

        <p class="subtitle">
          POST /api/v1/meter-readings
        </p>
      </div>

    </div>

  </div>


  @if (
    error()
  ) {
    <div class="error">
      Unable to create meter reading.
    </div>
  }


  <app-meter-reading-form
    [initialMeterId]="meterId"
    [submitting]="submitting()"
    (submitted)="create($event)"
    (cancelled)="cancel()"
  />

</section>
