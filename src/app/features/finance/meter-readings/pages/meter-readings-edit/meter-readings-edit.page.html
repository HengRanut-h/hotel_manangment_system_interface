<section class="page">

  <a
    class="back-link"
    [routerLink]="[
      '/app/finance/meter-readings',
      id
    ]"
  >
    <svg lucideArrowLeft
      [size]="17"
      [strokeWidth]="2"
    ></svg>

    Back
  </a>


  <div class="page-header">

    <div class="heading">

      <div class="heading-icon">
        <svg lucidePencil
          [size]="24"
          [strokeWidth]="2"
        ></svg>
      </div>

      <div>
        <h1>
          Edit Meter Reading
        </h1>

        <p class="subtitle">
          Update the selected reading record.
        </p>
      </div>

    </div>

  </div>


  @if (
    loading()
  ) {
    <div class="state">
      Loading reading...
    </div>

  } @else if (
    error()
  ) {
    <div class="error">
      Unable to load or update meter reading.
    </div>

  } @else if (
    item();
    as reading
  ) {
    <app-meter-reading-form
      [initialValue]="reading"
      [submitting]="submitting()"
      submitLabel="Update Reading"
      (submitted)="update($event)"
      (cancelled)="cancel()"
    />
  }

</section>
