<section class="page">
  <a
    class="back-link"
    routerLink="/app/finance/folios"
  >
    <svg lucideArrowLeft [size]="17" ></svg>
    Back to Folios
  </a>

  <div class="page-header">
    <div class="heading">
      <div class="heading-icon">
        <svg lucideFilePlus2 [size]="24" ></svg>
      </div>
      <div>
        <h1>Create Folio</h1>
        <p class="subtitle">
          Reservation ID + Guest ID
        </p>
      </div>
    </div>
  </div>

  @if (error()) {
    <div class="error">
      Unable to create folio.
    </div>
  }

  <app-folio-create-form
    [submitting]="submitting()"
    (submitted)="create($event)"
    (cancelled)="cancel()"
  />
</section>
