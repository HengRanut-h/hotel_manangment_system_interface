<form class="form-card" (ngSubmit)="submit()">
  <div class="form-header">
    <svg lucideReceiptText [size]="24" ></svg>
    <div>
      <h2>Add Charge</h2>
      <p>Post a charge to this open folio.</p>
    </div>
  </div>

  @if (
    touched() &&
    (
      !category().trim() ||
      !description().trim() ||
      amount() === null ||
      amount()! <= 0
    )
  ) {
    <div class="validation">
      Category, description and positive amount are required.
    </div>
  }

  <div class="grid">
    <label>
      <span>Category *</span>
      <input
        name="category"
        [ngModel]="category()"
        (ngModelChange)="category.set($event)"
      />
    </label>

    <label>
      <span>Amount *</span>
      <input
        type="number"
        min="0.01"
        step="0.01"
        name="amount"
        [ngModel]="amount()"
        (ngModelChange)="amount.set($event)"
      />
    </label>

    <label class="full">
      <span>Description *</span>
      <textarea
        rows="4"
        name="description"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
      ></textarea>
    </label>
  </div>

  <div class="actions">
    <button
      type="button"
      class="secondary"
      [disabled]="submitting()"
      (click)="cancelled.emit()"
    >
      <svg lucideX [size]="17" ></svg>
      Cancel
    </button>

    <button
      type="submit"
      class="primary"
      [disabled]="submitting()"
    >
      <svg lucidePlus [size]="17" ></svg>
      {{ submitting() ? 'Posting...' : 'Add Charge' }}
    </button>
  </div>
</form>
