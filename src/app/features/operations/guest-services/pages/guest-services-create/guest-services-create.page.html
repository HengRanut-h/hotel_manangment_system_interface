<section class="form-page">
  <header class="form-page__header">
    <a
      class="back-link"
      routerLink="/app/operations/services">
      <svg lucideArrowLeft></svg>
      {{ 'guestServices.backToServices' | translate }}
    </a>

    <p class="eyebrow">
      {{ 'guestServices.section' | translate }}
    </p>

    <h1>
      {{ 'guestServices.createTitle' | translate }}
    </h1>

    <span>
      {{ 'guestServices.createDescription' | translate }}
    </span>
  </header>

  <app-guest-service-form
    [submitting]="submitting()"
    [showStatus]="false"
    submitLabel="guestServices.createAction"
    (submitted)="save($event)"
    (cancelled)="cancel()" />
</section>
