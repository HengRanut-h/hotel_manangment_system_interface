<form
  class="form-grid"
  (submit)="$event.preventDefault(); submit()">

  <label>
    <span>
      {{ 'restaurant.category' | translate }}
      <strong>*</strong>
    </span>

    <select
      [value]="categoryId()"
      (change)="setCategory($event)">
      <option value="">
        {{ 'restaurant.selectCategory' | translate }}
      </option>

      @for (
        category of categories();
        track category.id
      ) {
        <option
          [value]="category.id"
          [disabled]="!category.isActive">
          {{ category.name }}
        </option>
      }
    </select>
  </label>

  <label>
    <span>
      {{ 'restaurant.itemName' | translate }}
      <strong>*</strong>
    </span>

    <input
      type="text"
      maxlength="200"
      [value]="name()"
      [placeholder]="'restaurant.itemNamePlaceholder' | translate"
      (input)="setName($event)" />
  </label>

  <label>
    <span>
      {{ 'restaurant.price' | translate }}
      <strong>*</strong>
    </span>

    <input
      type="number"
      min="0"
      step="0.01"
      [value]="price()"
      placeholder="0.00"
      (input)="setPrice($event)" />
  </label>

  <label class="checkbox">
    <input
      type="checkbox"
      [checked]="isAvailable()"
      (change)="setAvailable($event)" />

    <span>
      {{ 'restaurant.isAvailable' | translate }}
    </span>
  </label>

  @if (
    touched()
    &&
    (
      !categoryId().trim()
      ||
      !name().trim()
      ||
      !price().trim()
    )
  ) {
    <p class="form-error">
      {{ 'restaurant.itemFieldsRequired' | translate }}
    </p>
  }

  <button
    type="submit">
    <svg lucideCheck></svg>

    <span>
      {{ 'restaurant.createItem' | translate }}
    </span>
  </button>

</form>
