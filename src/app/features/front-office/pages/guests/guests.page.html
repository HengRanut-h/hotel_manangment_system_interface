<div class="page-header"><div><span class="eyebrow">Guest CRM</span><h1>Guests</h1><p>Profiles, contact details and VIP recognition for every guest.</p></div><button class="btn btn--primary" type="button" (click)="openCreate()"><svg lucideCirclePlus></svg>Add guest</button></div><section class="panel guests-panel"><div class="guest-toolbar"><label class="search-box"><svg lucideSearch></svg><input type="search" placeholder="Search by guest name..." [value]="search()" (input)="setSearch($event)"></label></div><div class="guest-grid">@for(g of rows();track g.id){<article class="guest-card"><div class="guest-avatar"><svg lucideUserRound></svg></div><div class="guest-info"><div><strong>{{ g.fullName }}</strong>@if(g.isVip){<span class="vip"><svg lucideCrown></svg>VIP</span>}</div><span><svg lucidePhone></svg>{{ g.phone || 'No phone' }}</span><span><svg lucideMail></svg>{{ g.email || 'No email' }}</span></div><button type="button" class="edit-btn" (click)="openEdit(g)"><svg lucidePencil></svg></button></article>}@empty{<div class="empty-guests">No guests found.</div>}</div><app-pager [page]="page()" [pageSize]="20" [total]="total()" (pageChange)="changePage($event)"/></section><app-modal [open]="modal()" [title]="editId() ? 'Edit Guest' : 'Add Guest'" (closed)="modal.set(false)"><form class="form-grid" (ngSubmit)="save()"><label><span>First name</span><input name="firstName" required [(ngModel)]="firstName"></label><label><span>Last name</span><input name="lastName" required [(ngModel)]="lastName"></label><label><span>Phone</span><input name="phone" [(ngModel)]="phone"></label><label><span>Email</span><input name="email" type="email" [(ngModel)]="email"></label><div class="form-actions field--full"><button class="btn btn--secondary" type="button" (click)="modal.set(false)">Cancel</button><button class="btn btn--primary" type="submit">Save guest</button></div></form></app-modal>
