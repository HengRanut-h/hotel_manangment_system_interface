<section class="form-page">

  <header class="form-page__header">

    <a
      class="back-link"
      routerLink="/app/property/hotels">

      <span class="back-link__icon">
        <svg lucideArrowLeft></svg>
      </span>

      <span class="back-link__text">
        {{ 'hotels.title' | translate }}
      </span>

    </a>


    <p>
      {{ 'hotels.section' | translate }}
    </p>


    <h1>
      {{ 'hotels.createTitle' | translate }}
    </h1>


    <span class="form-page__description">
      {{
        'hotels.createDescription'
          | translate
      }}
    </span>

  </header>


  <app-hotel-form
    [saving]="saving()"
    [showStatus]="false"
    [submitLabel]="
      'hotels.create'
        | translate
    "
    (submitted)="save($event)"
    (cancelled)="cancel()" />

</section>
