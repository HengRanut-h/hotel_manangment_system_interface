<section class="form-page">

  @if (loading()) {
    <div class="state-box">
      <app-spin
        [inline]="true"
        size="small"
        [label]="
          'rooms.loadingOne'
            | translate
        " />
    </div>
  } @else if (error()) {
    <div class="state-box state-box--error">
      <p>
        {{ error() }}
      </p>
      <button
        type="button"
        class="button button--secondary"
        (click)="load()">
        {{ 'rooms.tryAgain' | translate }}
      </button>
    </div>
  } @else if (
    room();
    as item
  ) {
    <header class="form-page__header">
      <a
        class="back-link"
        [routerLink]="[
          '/app/property/rooms',
          item.id
        ]">
        <span class="back-link__icon">
          <svg lucideArrowLeft></svg>
        </span>
        <span class="back-link__text">
          {{ item.roomNumber }}
        </span>
      </a>

      <p>
        {{ 'rooms.section' | translate }}
      </p>

      <h1>
        {{ 'rooms.editTitle' | translate }}
      </h1>

      <span class="form-page__description">
        {{
          'rooms.editDescription'
            | translate
        }}
      </span>
    </header>

    <app-room-form
      [roomNumber]="item.roomNumber"
      [roomTypeId]="item.roomTypeId"
      [floor]="item.floor"
      [roomTypeOptions]="roomTypeOptions()"
      [showBranch]="false"
      [loadingOptions]="loadingOptions()"
      [saving]="saving()"
      [submitLabel]="
        'rooms.saveChanges'
          | translate
      "
      (submitted)="save($event)"
      (cancelled)="cancel()" />
  }

</section>
