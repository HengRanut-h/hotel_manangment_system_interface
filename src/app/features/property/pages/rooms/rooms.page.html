<div class="page-header"><div><span class="eyebrow">Property</span><h1>Rooms</h1><p>Room inventory, floor placement, room type and live operational status.</p></div><button class="btn btn--primary" type="button" (click)="create()"><svg lucideCirclePlus></svg>Add room</button></div><section class="panel room-panel"><div class="room-toolbar"><label><svg lucideSearch></svg><input type="search" placeholder="Search room number or type..." [value]="search()" (input)="setSearch($event)"></label></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Room</th><th>Type</th><th>Floor</th><th>Status</th><th>Change status</th><th>Actions</th></tr></thead><tbody>@for(r of rows();track r.id){<tr><td><span class="room-number"><svg lucideDoorOpen></svg><strong>{{ r.roomNumber }}</strong></span></td><td>{{ r.roomTypeName }}</td><td>Floor {{ r.floor }}</td><td><app-status-badge [value]="r.status"/></td><td><select class="status-select" [value]="r.status" (change)="status(r,$event)"><option>Available</option><option>Reserved</option><option>Occupied</option><option>Dirty</option><option>Cleaning</option><option>Maintenance</option><option>OutOfOrder</option><option>Blocked</option></select></td><td class="actions"><button (click)="edit(r)" type="button"><svg lucidePencil></svg></button><button class="danger" (click)="remove(r)" type="button"><svg lucideTrash2></svg></button></td></tr>}@empty{<tr><td colspan="6" class="empty">No rooms found.</td></tr>}</tbody></table></div><app-pager [page]="page()" [pageSize]="20" [total]="total()" (pageChange)="changePage($event)"/></section><app-modal [open]="modal()" [title]="editId()?'Edit Room':'Add Room'" (closed)="modal.set(false)"><form class="form-grid" (ngSubmit)="save()"><label><span>Room number</span><input name="roomNumber" required [(ngModel)]="roomNumber"></label><label><span>Room type</span><select name="roomTypeId" required [(ngModel)]="roomTypeId">@for(t of types();track t.id){<option [value]="t.id">{{ t.name }}</option>}</select></label><label><span>Floor</span><input name="floor" type="number" min="0" [(ngModel)]="floor"></label><div class="form-actions field--full"><button type="button" class="btn btn--secondary" (click)="modal.set(false)">Cancel</button><button type="submit" class="btn btn--primary">Save room</button></div></form></app-modal>
