<section class="page">

  <a
    class="back-link"
    routerLink="/app/inbox/notifications"
  >
    <svg lucideArrowLeft
      [size]="17"
      [strokeWidth]="2"
    ></svg>

    Back to Notifications
  </a>


  <div class="page-header">

    <div class="heading">

      <div class="heading-icon">
        <svg lucideBarChart3
          [size]="24"
          [strokeWidth]="2"
        ></svg>
      </div>

      <div>
        <h1>
          Notification Analytics
        </h1>

        <p class="subtitle">
          Summary calculated from live notification records.
        </p>
      </div>

    </div>

  </div>


  @if (
    loading()
  ) {
    <div class="state">
      Loading analytics...
    </div>

  } @else {

    <div class="summary-grid">

      <article class="summary-card">

        <div class="summary-icon summary-icon--purple">
          <svg lucideBell
            [size]="20"
            [strokeWidth]="2"
          ></svg>
        </div>

        <div>
          <span>
            Records Loaded
          </span>

          <strong>
            {{ total() }}
          </strong>
        </div>

      </article>


      <article class="summary-card">

        <div class="summary-icon summary-icon--green">
          <svg lucideMail
            [size]="20"
            [strokeWidth]="2"
          ></svg>
        </div>

        <div>
          <span>
            Unread
          </span>

          <strong>
            {{ unread() }}
          </strong>
        </div>

      </article>


      <article class="summary-card">

        <div class="summary-icon summary-icon--blue">
          <svg lucideMailOpen
            [size]="20"
            [strokeWidth]="2"
          ></svg>
        </div>

        <div>
          <span>
            Read
          </span>

          <strong>
            {{ read() }}
          </strong>
        </div>

      </article>


      <article class="summary-card">

        <div class="summary-icon summary-icon--amber">
          <svg lucideArchive
            [size]="20"
            [strokeWidth]="2"
          ></svg>
        </div>

        <div>
          <span>
            Archived
          </span>

          <strong>
            {{ archived() }}
          </strong>
        </div>

      </article>

    </div>


    <div class="summary-grid">

      <article class="summary-card">
        <div>
          <span>
            Urgent
          </span>

          <strong>
            {{ urgent() }}
          </strong>
        </div>
      </article>

    </div>

  }

</section>
