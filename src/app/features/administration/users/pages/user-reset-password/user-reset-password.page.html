<div class="reset-password-page">

  <app-page-header
    [eyebrow]="'users.section' | translate"
    [title]="'users.resetPassword' | translate"
    [description]="'users.resetPasswordDescription' | translate"
    [backLabel]="'common.back' | translate"
    [backUrl]="'/app/admin/users/' + id()" />

  @if (loading()) {

    <app-spin
      [label]="'users.loadingOne' | translate"
      size="large" />

  } @else if (errorMessage()) {

    <section class="state state--error">

      <strong>
        {{ 'users.loadOneFailed' | translate }}
      </strong>

      <span>
        {{ errorMessage() }}
      </span>

      <button
        type="button"
        class="retry-button"
        (click)="load()">

        <svg lucideRefreshCw></svg>

        <span>
          {{ 'common.tryAgain' | translate }}
        </span>

      </button>

    </section>

  } @else {

    <section class="password-card">

      <header>

        <span class="password-icon">
          <svg lucideKeyRound></svg>
        </span>

        <div>
          <strong>
            {{ userName() }}
          </strong>

          <small>
            {{ 'users.resetPasswordHelp' | translate }}
          </small>
        </div>

      </header>

      <div class="form-group">

        <label for="newPassword">
          {{ 'users.newPassword' | translate }}
        </label>

        <div class="password-input">

          <input
            id="newPassword"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            maxlength="200"
            [disabled]="saving()"
            [value]="password()"
            (input)="setPassword($event)">

          <button
            type="button"
            [disabled]="saving()"
            (click)="showPassword.set(!showPassword())">

            @if (showPassword()) {
              <svg lucideEyeOff></svg>
            } @else {
              <svg lucideEye></svg>
            }

          </button>

        </div>

      </div>

      <div class="form-group">

        <label for="confirmPassword">
          {{ 'users.confirmPassword' | translate }}
        </label>

        <div class="password-input">

          <input
            id="confirmPassword"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            maxlength="200"
            [disabled]="saving()"
            [value]="confirmPassword()"
            (input)="setConfirmPassword($event)">

        </div>

        @if (
          confirmPassword()
          &&
          password() !== confirmPassword()
        ) {

          <small class="error-text">
            {{ 'users.passwordMismatch' | translate }}
          </small>

        }

      </div>

      <div class="actions">

        <button
          type="button"
          class="button button--secondary"
          [disabled]="saving()"
          (click)="cancel()">

          {{ 'common.cancel' | translate }}

        </button>

        <button
          type="button"
          class="button button--primary"
          [disabled]="
            saving()
            ||
            password().length < 8
            ||
            password() !== confirmPassword()
          "
          (click)="save()">

          @if (saving()) {

            <app-spin
              [inline]="true"
              size="small"
              [label]="'common.saving' | translate" />

          } @else {

            {{ 'users.resetPassword' | translate }}

          }

        </button>

      </div>

    </section>

  }

</div>
