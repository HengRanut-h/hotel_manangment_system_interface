<span
  class="badge"
  [class.pending]="status() === 'Pending'"
  [class.running]="status() === 'Running'"
  [class.completed]="status() === 'Completed'"
  [class.failed]="status() === 'Failed'"
  [class.cancelled]="status() === 'Cancelled'"
>
  @switch (
    status()
  ) {

    @case ('Pending') {
      <svg lucideClock3
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @case ('Running') {
      <svg lucideLoaderCircle
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @case ('Completed') {
      <svg lucideCircleCheck
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @case ('Failed') {
      <svg lucideCircleX
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @case ('Cancelled') {
      <svg lucideBan
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }

    @default {
      <svg lucideClock3
        [size]="14"
        [strokeWidth]="2"
      ></svg>
    }
  }

  {{ status() || 'Pending' }}
</span>
