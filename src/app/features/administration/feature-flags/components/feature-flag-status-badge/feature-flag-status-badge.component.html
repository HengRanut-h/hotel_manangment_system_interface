@if (
  deleted()
) {
  <span class="badge deleted">
    <svg lucideTrash2
      [size]="14"
      [strokeWidth]="2"
    ></svg>

    Deleted
  </span>

} @else if (
  enabled()
) {
  <span class="badge enabled">
    <svg lucideToggleRight
      [size]="15"
      [strokeWidth]="2"
    ></svg>

    Enabled
  </span>

} @else {
  <span class="badge disabled">
    <svg lucideToggleLeft
      [size]="15"
      [strokeWidth]="2"
    ></svg>

    Disabled
  </span>
}
