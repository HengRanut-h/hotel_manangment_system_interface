<section class="page">

  <a
    class="back-link"
    [routerLink]="[
      '/app/management/settings',
      id
    ]"
  >
    <svg lucideArrowLeft
      [size]="17"
      [strokeWidth]="2"
    ></svg>

    Back
  </a>


  <div class="page-header">

    <div class="heading">

      <div class="heading-icon">
        <svg lucidePencil
          [size]="24"
          [strokeWidth]="2"
        ></svg>
      </div>

      <div>
        <h1>
          Edit Setting
        </h1>

        <p class="subtitle">
          Update application configuration.
        </p>
      </div>

    </div>

  </div>


  @if (
    loading()
  ) {
    <div class="state">
      Loading setting...
    </div>

  } @else if (
    error()
  ) {
    <div class="error">
      Unable to load or update setting.
    </div>

  } @else if (
    item();
    as setting
  ) {
    <app-setting-form
      [initialValue]="setting"
      [submitting]="submitting()"
      submitLabel="Update Setting"
      (submitted)="update($event)"
      (cancelled)="cancel()"
    />
  }

</section>
