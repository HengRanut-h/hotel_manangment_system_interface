<div class="language-selector">

  <span
    class="language-icon"
    aria-hidden="true">

    🌐

  </span>

  <select
    aria-label="Change language"
    [value]="languageService.currentLanguage()"
    (change)="changeLanguage($event)">

    @for (
      language
      of languageService.languages;
      track language.code
    ) {

      <option
        [value]="language.code">

        {{ language.nativeName }}

      </option>

    }

  </select>

</div>
